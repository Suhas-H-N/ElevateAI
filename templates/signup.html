{% extends "base.html" %}

{% block title %}Signup - Elevate AI{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- HEADER -->
        <div class="auth-header">
            <div class="header-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M19 8v6m3-3h-6"></path>
                </svg>
            </div>
            <h2>Create Account</h2>
            <p class="subtitle">Start your AI interview journey today</p>
        </div>

        <!-- FORM -->
        <form method="POST" class="auth-form">

            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input 
                        type="text" 
                        name="username" 
                        placeholder="Choose a unique username" 
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Create a strong password" 
                            required
                        >
                        <span class="toggle-eye" onclick="togglePassword()">👁️</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="auth-btn signup-btn">
                <span class="btn-icon">✨</span>
                Create Your Account
            </button>

        </form>

        <!-- FOOTER -->
        <p class="bottom-text">
            Already have an account?
            <a href="/">Login here</a>
        </p>

    </div>

</div>

<!-- PASSWORD TOGGLE -->
<script>
function togglePassword() {
    const pwd = document.getElementById("password");
    pwd.type = pwd.type === "password" ? "text" : "password";
}
</script>

{% endblock %}
