{% extends "base.html" %}

{% block title %}Profile Setup - Elevate AI{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- HEADER -->
        <h2>Complete Your Profile 🚀</h2>
        <p class="subtitle">Help us personalize your interview experience</p>

        <!-- FORM -->
        <form method="POST" class="profile-form">

            <div class="form-row">
                <input 
                    type="text" 
                    name="name" 
                    placeholder="Full Name" 
                    required
                    value="{{ user.name or '' }}"
                >

                <input 
                    type="email" 
                    name="email" 
                    placeholder="Email Address" 
                    value="{{ user.email or '' }}"
                >
            </div>

            <div class="form-row">
                <input 
                    type="date" 
                    name="dob" 
                    placeholder="Date of Birth"
                    value="{{ user.dob.strftime('%Y-%m-%d') if user.dob else '' }}"
                >

                <select name="gender">
                    <option value="">Select Gender (Optional)</option>
                    <option value="Male" {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
                    <option value="Prefer not to say" {% if user.gender == 'Prefer not to say' %}selected{% endif %}>Prefer not to say</option>
                </select>
            </div>

            <input 
                type="text" 
                name="college" 
                placeholder="College/University" 
                value="{{ user.college or '' }}"
            >

            <div class="form-row">
                <input 
                    type="text" 
                    name="degree" 
                    placeholder="Degree (BTech, BCA, etc.)" 
                    value="{{ user.degree or '' }}"
                >

                <input 
                    type="text" 
                    name="branch" 
                    placeholder="Branch (CSE, ECE, etc.)" 
                    value="{{ user.branch or '' }}"
                >
            </div>

            <div class="form-row">
                <div class="button-group">
                    <label>Year of Study</label>
                    <div class="radio-buttons">
                        <input type="radio" id="year1" name="year_of_study" value="1st Year" {% if user.year_of_study == '1st Year' %}checked{% endif %}>
                        <label for="year1" class="radio-btn">1st Year</label>
                        
                        <input type="radio" id="year2" name="year_of_study" value="2nd Year" {% if user.year_of_study == '2nd Year' %}checked{% endif %}>
                        <label for="year2" class="radio-btn">2nd Year</label>
                        
                        <input type="radio" id="year3" name="year_of_study" value="3rd Year" {% if user.year_of_study == '3rd Year' %}checked{% endif %}>
                        <label for="year3" class="radio-btn">3rd Year</label>
                        
                        <input type="radio" id="year4" name="year_of_study" value="4th Year" {% if user.year_of_study == '4th Year' %}checked{% endif %}>
                        <label for="year4" class="radio-btn">4th Year</label>
                        
                        <input type="radio" id="year5" name="year_of_study" value="Final Year" {% if user.year_of_study == 'Final Year' %}checked{% endif %}>
                        <label for="year5" class="radio-btn">Final Year</label>
                        
                        <input type="radio" id="year6" name="year_of_study" value="Completed" {% if user.year_of_study == 'Completed' %}checked{% endif %}>
                        <label for="year6" class="radio-btn">Completed</label>
                    </div>
                </div>

                <div class="button-group">
                    <label>Select Profession</label>
                    <div class="radio-buttons">
                        <input type="radio" id="prof1" name="profession" value="Student" {% if user.profession == 'Student' %}checked{% endif %}>
                        <label for="prof1" class="radio-btn">Student</label>
                        
                        <input type="radio" id="prof2" name="profession" value="Developer" {% if user.profession == 'Developer' %}checked{% endif %}>
                        <label for="prof2" class="radio-btn">Developer</label>
                        
                        <input type="radio" id="prof3" name="profession" value="Fresher" {% if user.profession == 'Fresher' %}checked{% endif %}>
                        <label for="prof3" class="radio-btn">Fresher</label>
                        
                        <input type="radio" id="prof4" name="profession" value="Working Professional" {% if user.profession == 'Working Professional' %}checked{% endif %}>
                        <label for="prof4" class="radio-btn">Working Professional</label>
                        
                        <input type="radio" id="prof5" name="profession" value="Other" {% if user.profession == 'Other' %}checked{% endif %}>
                        <label for="prof5" class="radio-btn">Other</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="auth-btn">Complete Profile</button>

        </form>

    </div>

</div>

{% endblock %}
