{% extends "base.html" %}
{% block title %}404 — ElevateAI{% endblock %}
{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">404</div>
        <div class="error-msg">Page not found</div>
        <div class="error-sub">The page you're looking for doesn't exist or has been moved.</div>
        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-primary btn-lg">← Go Home</a>
    </div>
</div>
{% endblock %}
