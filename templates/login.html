{% extends "base.html" %}
{% block title %}Sign In — ElevateAI{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
        </div>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to continue your interview prep</p>

        <form method="POST" action="{{ url_for('login') }}" autocomplete="on">

            <div class="field">
                <label class="field-label" for="username">Username</label>
                <div class="input-wrap has-icon">
                    <span class="input-icon">@</span>
                    <input
                        class="field-input"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="your_username"
                        required
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <div class="field">
                <label class="field-label" for="password">Password</label>
                <div class="input-wrap has-icon">
                    <span class="input-icon">🔒</span>
                    <input
                        class="field-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="eye-toggle" onclick="togglePwd('password', this)" aria-label="Show/hide password">👁</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full mt-24">
                Sign In →
            </button>

        </form>

        <div class="auth-footer mt-16">
            New to ElevateAI?
            <a href="{{ url_for('signup') }}">Create an account</a>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePwd(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁';
    }
}
</script>
{% endblock %}
