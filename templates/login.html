{% extends "base.html" %}

{% block title %}Login - Elevate AI{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- HEADER -->
        <h2>Welcome Back 👋</h2>
        <p class="subtitle">Login to continue your AI interview journey</p>

        <!-- FORM -->
        <form method="POST" class="auth-form">

            <input 
                type="text" 
                name="username" 
                placeholder="Enter username" 
                required
            >

            <div class="password-wrapper">
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter password" 
                    required
                >
                <span class="toggle-eye" onclick="togglePassword()">👁️</span>
            </div>

            <button type="submit" class="auth-btn login-btn">Login</button>

        </form>

        <!-- FOOTER -->
        <p class="bottom-text">
            Don’t have an account?
            <a href="/signup">Create one</a>
        </p>

    </div>

</div>

<!-- PASSWORD TOGGLE -->
<script>
function togglePassword() {
    const pwd = document.getElementById("password");
    pwd.type = pwd.type === "password" ? "text" : "password";
}
</script>

{% endblock %}
