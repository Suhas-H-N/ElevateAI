{% extends "base.html" %}
{% block title %}Set New Password — ElevateAI{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>

        <h1 class="auth-title">Set new password</h1>
        <p class="auth-sub">Choose a strong password for your account.</p>

        <form method="POST" id="resetForm">
            <div class="field">
                <label class="field-label" for="password">New Password</label>
                <div class="input-wrap has-icon">
                    <span class="input-icon">🔒</span>
                    <input class="field-input" type="password" id="password" name="password"
                           placeholder="Min 8 chars, 1 uppercase, 1 number" required autofocus
                           autocomplete="new-password">
                    <button type="button" class="eye-toggle" onclick="togglePwd('password',this)">👁</button>
                </div>
                <div id="pwdStrength"></div>
            </div>
            <div class="field">
                <label class="field-label" for="confirm">Confirm Password</label>
                <div class="input-wrap has-icon">
                    <span class="input-icon">🔒</span>
                    <input class="field-input" type="password" id="confirm" name="confirm"
                           placeholder="Re-enter your password" required
                           autocomplete="new-password">
                    <button type="button" class="eye-toggle" onclick="togglePwd('confirm',this)">👁</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-full mt-16">
                Update Password →
            </button>
        </form>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePwd(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
}

document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['','#EF4444','#F59E0B','#22C55E','#6C63FF'];
    const labels = ['','Weak','Fair','Good','Strong'];
    const el = document.getElementById('pwdStrength');
    if (!val) { el.innerHTML=''; return; }
    el.innerHTML = `<div style="display:flex;gap:4px;margin-top:6px;">${[1,2,3,4].map(i=>`<div style="flex:1;height:3px;border-radius:4px;background:${i<=score?colors[score]:'var(--border)'}"></div>`).join('')}</div><span style="font-size:0.75rem;color:${colors[score]};font-weight:600;">${labels[score]}</span>`;
});

document.getElementById('resetForm').addEventListener('submit', function(e) {
    if (document.getElementById('password').value !== document.getElementById('confirm').value) {
        e.preventDefault();
        alert('Passwords do not match.');
    }
});
</script>
{% endblock %}
