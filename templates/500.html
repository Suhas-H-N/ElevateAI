{% extends "base.html" %}
{% block title %}500 — ElevateAI{% endblock %}
{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">500</div>
        <div class="error-msg">Something went wrong</div>
        <div class="error-sub">An unexpected error occurred on our end. Please try again in a moment.</div>
        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-primary btn-lg">← Go Home</a>
    </div>
</div>
{% endblock %}
