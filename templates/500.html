{% extends "base.html" %}
{% block title %}500 — Server Error · ElevateAI{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">500</div>
        <div class="error-msg">Something went wrong</div>
        <p class="error-sub">An Internal server error occurred. Please try again in a moment.</p>
        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-primary btn-lg">
            ← Go Home
        </a>
    </div>
</div>
{% endblock %}
