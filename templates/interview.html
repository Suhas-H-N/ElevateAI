{% extends "base.html" %}

{% block title %}Interview - Elevate AI{% endblock %}

{% block content %}

<div class="interview-container">

    <div class="interview-card">

        <!-- HEADER -->
        <div class="interview-header">
            <h2>🤖 AI Interview</h2>
            <p class="question-progress">
                Question {{ current }} of {{ total }}
            </p>

            <!-- TIMER -->
            <p class="timer">⏱ Time: <span id="time">00:00</span></p>
        </div>

        <!-- PROGRESS -->
        <div class="progress-bar">
            <div class="progress-fill" style="width: {{ (current / total) * 100 }}%;"></div>
        </div>

        <!-- QUESTION -->
        <div class="question-box fade-in">
            {{ question }}
        </div>

        <!-- FORM -->
        <form method="POST" class="answer-form">

            <textarea 
                name="answer" 
                id="answerBox"
                rows="5" 
                placeholder="Start typing your answer..." 
                required>
            </textarea>

            <!-- WORD COUNT -->
            <p class="word-count">Words: <span id="wordCount">0</span></p>

            <div class="button-group">
                <a href="/dashboard" class="back-btn">← Exit</a>
                <button type="submit" class="next-btn pulse">Next →</button>
            </div>

        </form>

    </div>

</div>

<!-- ===== SCRIPT ===== -->
<script>

// TIMER
let seconds = 0;
setInterval(() => {
    seconds++;
    let min = String(Math.floor(seconds / 60)).padStart(2, '0');
    let sec = String(seconds % 60).padStart(2, '0');
    document.getElementById("time").innerText = `${min}:${sec}`;
}, 1000);

// WORD COUNT
const textarea = document.getElementById("answerBox");
const wordCount = document.getElementById("wordCount");

textarea.addEventListener("input", () => {
    let words = textarea.value.trim().split(/\s+/).filter(w => w.length > 0);
    wordCount.innerText = words.length;
});

// AUTO FOCUS
window.onload = () => {
    textarea.focus();
};

</script>

{% endblock %}
